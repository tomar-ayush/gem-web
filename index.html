<style>
/* Layout: top bar with two tabs, one centred working column; tables scroll inside their own frames */
:root {
  --bg:#ffffff; --fg:#1b1f24; --muted:#5f6b78; --border:#dfe4ea; --soft:#f3f6f9; --accent:#2f5d8a;
  --ok:#2e7d32; --ok-soft:#e7f4e8; --bad:#c62828; --ph:#8a96a3; --warn-bg:#fff7e0; --warn-fg:#6d5a1e; --warn-border:#efdfae; --hover:#f8fafc;
  --sans:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#14181d; --fg:#e6eaee; --muted:#9aa6b2; --border:#2b333c; --soft:#1c2228; --accent:#8bb6e0;
  --ok:#81c784; --ok-soft:#1d3320; --bad:#ef9a9a; --ph:#6f7b87; --warn-bg:#2e2716; --warn-fg:#e6cf8a; --warn-border:#4a3f22; --hover:#1a2026; color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#14181d; --fg:#e6eaee; --muted:#9aa6b2; --border:#2b333c; --soft:#1c2228; --accent:#8bb6e0;
  --ok:#81c784; --ok-soft:#1d3320; --bad:#ef9a9a; --ph:#6f7b87; --warn-bg:#2e2716; --warn-fg:#e6cf8a; --warn-border:#4a3f22; --hover:#1a2026; color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 var(--sans); }
header { border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
header b { font-size:1.05rem; font-weight:600; }
nav { display:flex; gap:4px; }
nav button { background:none; border:0; padding:6px 10px; font:inherit; color:var(--muted); cursor:pointer; border-radius:6px; }
nav button.on { color:var(--fg); background:var(--soft); font-weight:600; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, tr:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.banner { background:var(--warn-bg); border-bottom:1px solid var(--warn-border); padding:8px 16px; font-size:0.85rem; color:var(--warn-fg); }
main { max-width:1100px; margin:0 auto; padding-block:20px 60px; padding-inline:16px; }
h1 { font-size:1.35rem; margin:0 0 4px; font-weight:600; text-wrap:balance; overflow-wrap:anywhere; }
h2 { font-size:1.05rem; margin:28px 0 8px; font-weight:600; }
.sub { color:var(--muted); font-size:0.88rem; margin:0 0 16px; }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
.filters input, .filters select { font:inherit; padding:7px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--fg); min-width:0; max-width:100%; }
.filters input { flex:1 1 240px; }
.table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:8px; }
table { border-collapse:collapse; width:100%; font-size:0.88rem; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
th { background:var(--soft); font-weight:600; white-space:nowrap; }
tr:last-child td { border-bottom:0; }
tbody tr.click { cursor:pointer; }
tbody tr.click:hover { background:var(--hover); }
td.num, th.num { text-align:right; white-space:nowrap; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:0.84rem; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin:12px 0; }
.tile { border:1px solid var(--border); border-radius:8px; padding:12px; min-width:0; }
.tile .v { font-size:1.35rem; font-weight:600; font-family:var(--mono); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.tile .l { color:var(--muted); font-size:0.8rem; }
.tile.ph { border-style:dashed; }
.tile.ph .v { color:var(--ph); }
.tag { display:inline-block; font-size:0.75rem; padding:1px 7px; border-radius:999px; background:var(--soft); color:var(--muted); white-space:nowrap; }
.q { color:var(--ok); font-weight:600; } .dq { color:var(--bad); font-weight:600; }
.tag.l1 { background:var(--ok-soft); color:var(--ok); font-weight:600; }
.grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
@media (max-width:700px){ .grid2 { grid-template-columns:minmax(0,1fr); } }
.card { border:1px solid var(--border); border-radius:8px; padding:12px 14px; min-width:0; }
.card h3 { margin:0 0 8px; font-size:0.95rem; font-weight:600; }
dl { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:4px 12px; margin:0; font-size:0.88rem; }
dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
.back { background:none; border:0; color:var(--accent); cursor:pointer; padding:0; font:inherit; margin-bottom:10px; }
a.lnk { color:var(--accent); cursor:pointer; text-decoration:none; }
a.lnk:hover { text-decoration:underline; }
.note { color:var(--muted); font-size:0.82rem; margin-top:6px; }
.placeholder { border:1px dashed var(--border); border-radius:8px; padding:14px; color:var(--ph); font-size:0.88rem; }
.ph-cell { color:var(--ph); }
</style>
</head>

58:47", "EMD Status": "Start-up", "EMD Status notes": ["MSE Social Category: OBC"], "MSE/MII Status": "MSE", "MSE/MII Status notes": ["Verified as Eligible for MSE Purchase Preference/Reservation", "MSE Social Category:OBC"], "Status": "Qualified"}, {"S.No.": "2", "Seller Name": "RIGHTWAYS PACKERS AND MOVERS", "Participated On": "15-09-2026 13:07:04", "EMD Status": "Registered with designated Agency / Authority", "EMD Status notes": ["MSE Social Category: General"], "MSE/MII Status": "MSE", "MSE/MII Status notes": ["Verified as Eligible for MSE Purchase Preference/Reservation", "MSE Social Category:General"], "Status": "Qualified"}, {"S.No.": "3", "Seller Name": "SCC LOGISTIC SOLUTION", "Participated On": "21-09-2026 11:49:37", "EMD Status": "Registered with designated Agency / Authority", "EMD Status notes": ["MSE Social Category: General"], "MSE/MII Status": "MSE", "MSE/MII Status notes": ["Verified as Eligible for MSE Purchase Preference/Reservation", "MSE Social Category:General"], "Status": "Qualified"}], "financial": [{"S.No.": "1", "Seller Name": "MANDAL INDUSTRIES PRIVATE LIMITED", "Offered Item": "Item Categories : Handling and Transport on Lumpsum Basis - Handling Service", "Total Price": "1220000.00", "Rank": "L1"}, {"S.No.": "2", "Seller Name": "SCC LOGISTIC SOLUTION", "Offered Item": "Item Categories : Handling and Transport on Lumpsum Basis - Handling Service", "Total Price": "1237000.00", "Rank": "L2"}, {"S.No.": "3", "Seller Name": "RIGHTWAYS PACKERS AND MOVERS", "Offered Item": "Item Categories : Handling and Transport on Lumpsum Basis - Handling Service", "Total Price": "1281060.00", "Rank": "L3"}], "notices": ["RA has been created for this Bid, To participate please search RA under \"ongoing bids/RAs available for participation\" filter and participate.", "Disclaimer : These are offered prices in bid and not approved / accepted prices. These may change if Buyer resorts to negotiation or price match as per Bid Conditions."]}];
let DATA = SAMPLE;
let companies = {}, companyList = [];

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cleanName = n => String(n || "").replace(/\s*\((?:MSE|MII|MSE,\s*MII|MII,\s*MSE)\)\s*$/i, "").replace(/\s+/g, " ").trim().toUpperCase();
const price = p => { const m = String(p || "").replace(/,/g, "").match(/[\d.]+/); return m ? parseFloat(m[0]) : null; };
const inr = v => v == null ? "-" : "₹ " + Math.round(v).toLocaleString("en-IN");
const item = o => typeof o === "object" && o ? Object.entries(o).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join("<br>") : esc(o);

// Build company aggregates from participations
function build() {
companies = {};
for (const r of DATA) {
  const finByName = {};
  for (const f of r.financial) finByName[cleanName(f["Seller Name"])] = f;
  const names = new Set(r.technical.map(t => cleanName(t["Seller Name"])));
  for (const f of r.financial) names.add(cleanName(f["Seller Name"]));
  for (const n of names) {
    const t = r.technical.find(x => cleanName(x["Seller Name"]) === n);
    const f = finByName[n];
    const c = companies[n] ||= { name: n, bids: [], tq: 0, l1: 0, l1Value: 0, ministries: {}, rivals: {} };
    c.bids.push({ r, t, f });
    if (!t || /qualified/i.test(t.Status) && !/disqualified/i.test(t.Status)) c.tq++;
    if (f && /^L1\b/.test(f.Rank)) { c.l1++; c.l1Value += price(f["Total Price"]) || 0; }
    c.ministries[r.ministry] = (c.ministries[r.ministry] || 0) + 1;
    for (const o of names) if (o !== n) c.rivals[o] = (c.rivals[o] || 0) + 1;
  }
}
companyList = Object.values(companies).sort((a, b) => b.bids.length - a.bids.length || b.l1 - a.l1);
}
build();

const app = document.getElementById("app");
let state = { view: "bids", q: "", ministry: "" };

function setView(v, extra = {}) {
  state = { ...state, view: v, ...extra };
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.view === (v === "bid" ? "bids" : v === "company" ? "companies" : v)));
  render();
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => setView(b.dataset.view));

function render() {
  if (state.view === "bids") return renderBids();
  if (state.view === "bid") return renderBid(state.id);
  if (state.view === "companies") return renderCompanies();
  if (state.view === "company") return renderCompany(state.name);
}

function renderBids() {
  const ministries = [...new Set(DATA.map(r => r.ministry))].sort();
  const q = state.q.toLowerCase();
  const rows = DATA.filter(r => (!state.ministry || r.ministry === state.ministry) &&
    (!q || [r.ra_number, r.bid_number, r.category, r.department].join(" ").toLowerCase().includes(q)));
  app.innerHTML = `
    <h1>Bids</h1>
    <p class="sub">${DATA.length} bids with results. Click a row for the evaluation.</p>
    <div class="filters">
      <input id="q" placeholder="Search bid number, category, department" value="${esc(state.q)}">
      <select id="min"><option value="">All ministries</option>${ministries.map(m => `<option ${m === state.ministry ? "selected" : ""}>${esc(m)}</option>`).join("")}</select>
      <select disabled><option>Status: all (filter planned)</option></select>
      <select disabled><option>End date: any (filter planned)</option></select>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>RA / Bid</th><th>Category</th><th>Ministry / Department</th><th class="num">Qty</th><th class="num">Sellers</th><th>L1 seller</th><th class="num">L1 price</th></tr></thead>
      <tbody>${rows.map(r => {
        const l1 = r.financial.find(f => /^L1\b/.test(f.Rank));
        return `<tr class="click" data-id="${r.b_id}">
          <td>${esc(r.ra_number)}<br><span class="note">${esc(r.bid_number)}</span></td>
          <td>${esc(r.category.slice(0, 90))}</td>
          <td>${esc(r.ministry)}<br><span class="note">${esc(r.department)}</span></td>
          <td class="num">${esc(r.quantity ?? "-")}</td>
          <td class="num">${r.technical.length}</td>
          <td>${l1 ? esc(cleanName(l1["Seller Name"])) : "-"}</td>
          <td class="num">${l1 ? inr(price(l1["Total Price"])) : "-"}</td></tr>`;
      }).join("") || `<tr><td colspan="7">No bids match.</td></tr>`}</tbody>
    </table></div>`;
  const qi = document.getElementById("q");
  qi.oninput = e => { state.q = e.target.value; renderBids(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  document.getElementById("min").onchange = e => { state.ministry = e.target.value; renderBids(); };
  app.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => setView("bid", { id: +tr.dataset.id }));
}

function dl(obj) {
  const e = Object.entries(obj || {});
  return e.length ? `<dl>${e.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : `<p class="note">Not on page.</p>`;
}

function renderBid(id) {
  const r = DATA.find(x => x.b_id === id);
  const status = s => /disqualified/i.test(s) ? `<span class="dq">${esc(s)}</span>` : /qualified/i.test(s) ? `<span class="q">${esc(s)}</span>` : esc(s);
  app.innerHTML = `
    <button class="back">← All bids</button>
    <h1>${esc(r.ra_number)}</h1>
    <p class="sub">Parent bid ${esc(r.bid_number)} · ${esc(r.category)}</p>
    <div class="grid2">
      <div class="card"><h3>Bid details</h3>${dl(r.bid_details)}</div>
      <div class="card"><h3>RA details</h3>${dl(r.ra_details)}</div>
      <div class="card"><h3>Buyer</h3>${dl(r.buyer)}<p class="note">Buyer name, email, phone and address are on the page but left out here.</p></div>
      <div class="card"><h3>Contract</h3><div class="placeholder">Contract number, seller ID, final value and status will come from View Contracts.</div></div>
    </div>
    <h2>Technical evaluation (${r.technical.length} sellers)</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Seller</th><th>Offered item</th><th>Participated on</th><th>EMD</th><th>MSE / MII</th><th>Status</th></tr></thead>
      <tbody>${r.technical.map(t => `<tr>
        <td><a class="lnk" href="#" data-co="${esc(cleanName(t["Seller Name"]))}">${esc(t["Seller Name"])}</a></td>
        <td>${item(t["Offered Item"])}</td>
        <td>${esc(t["Participated On"])}</td>
        <td>${esc(t["EMD Status"] ?? "-")}</td>
        <td>${esc(t["MSE/MII Status"] ?? "-")}${(t["MSE/MII Status notes"] || []).length ? `<div class="note">${(t["MSE/MII Status notes"]).map(esc).join("<br>")}</div>` : ""}</td>
        <td>${status(t.Status)}</td></tr>`).join("")}</tbody>
    </table></div>
    <h2>Financial evaluation (${r.financial.length} sellers)</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Rank</th><th>Seller</th><th class="num">Total price</th><th class="num">vs L1</th></tr></thead>
      <tbody>${(() => { const l1 = price((r.financial.find(f => /^L1\b/.test(f.Rank)) || {})["Total Price"]);
        return r.financial.map(f => { const p = price(f["Total Price"]);
          return `<tr><td><span class="tag ${/^L1\b/.test(f.Rank) ? "l1" : ""}">${esc(f.Rank)}</span></td>
          <td><a class="lnk" href="#" data-co="${esc(cleanName(f["Seller Name"]))}">${esc(f["Seller Name"])}</a></td>
          <td class="num">${inr(p)}</td>
          <td class="num">${l1 && p && p !== l1 ? "+" + ((p / l1 - 1) * 100).toFixed(1) + "%" : "-"}</td></tr>`; }).join(""); })()}</tbody>
    </table></div>
    <p class="note">Offered prices. GeM states these may change through negotiation or price matching.</p>
    ${r.notices.length ? `<h2>Notices</h2><ul>${r.notices.map(n => `<li class="note">${esc(n)}</li>`).join("")}</ul>` : ""}`;
  app.querySelector(".back").onclick = () => setView("bids");
  app.querySelectorAll("a[data-co]").forEach(a => a.onclick = e => { e.preventDefault(); setView("company", { name: a.dataset.co }); });
}

function renderCompanies() {
  app.innerHTML = `
    <h1>Companies</h1>
    <p class="sub">${companyList.length} sellers found in the sample, grouped by name. Click a row for the company page.</p>
    <div class="filters"><input id="cq" placeholder="Search company"></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Company</th><th class="num">Bids placed</th><th class="num">Tech qualified</th><th class="num">Ranked L1</th><th class="num">L1 value</th><th class="num">Contracts won</th><th class="num">Awarded value</th></tr></thead>
      <tbody id="ctb"></tbody>
    </table></div>
    <p class="note">Contracts won and awarded value need the contract crawl. Shown as "?" until then.</p>`;
  const fill = q => document.getElementById("ctb").innerHTML = companyList.filter(c => c.name.includes(q.toUpperCase())).map(c => `
    <tr class="click" data-co="${esc(c.name)}"><td>${esc(c.name)}</td><td class="num">${c.bids.length}</td><td class="num">${c.tq}</td>
    <td class="num">${c.l1}</td><td class="num">${c.l1 ? inr(c.l1Value) : "-"}</td><td class="num ph-cell">?</td><td class="num ph-cell">?</td></tr>`).join("");
  fill("");
  document.getElementById("cq").oninput = e => { fill(e.target.value); bindRows(); };
  const bindRows = () => app.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => setView("company", { name: tr.dataset.co }));
  bindRows();
}

function renderCompany(name) {
  const c = companies[name];
  if (!c) { app.innerHTML = `<button class="back">← Companies</button><p>Not found.</p>`; app.querySelector(".back").onclick = () => setView("companies"); return; }
  const top = (o, n = 5) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n);
  app.innerHTML = `
    <button class="back">← Companies</button>
    <h1>${esc(c.name)}</h1>
    <p class="sub">Matched by name only. Seller ID and GSTIN will come from contract documents.</p>
    <div class="tiles">
      <div class="tile"><div class="v">${c.bids.length}</div><div class="l">Bids placed</div></div>
      <div class="tile"><div class="v">${c.tq}</div><div class="l">Technically qualified</div></div>
      <div class="tile"><div class="v">${c.l1}</div><div class="l">Ranked L1</div></div>
      <div class="tile"><div class="v">${c.bids.length ? Math.round(c.l1 / c.bids.length * 100) : 0}%</div><div class="l">L1 rate (L1 ÷ bids placed)</div></div>
      <div class="tile"><div class="v">${c.l1 ? inr(c.l1Value) : "-"}</div><div class="l">Value of L1 offers</div></div>
      <div class="tile ph"><div class="v">?</div><div class="l">Contracts won</div></div>
      <div class="tile ph"><div class="v">?</div><div class="l">Awarded value</div></div>
      <div class="tile ph"><div class="v">?</div><div class="l">Win rate (contracts ÷ bids)</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Buyers (by ministry)</h3><dl>${top(c.ministries).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v} bid${v > 1 ? "s" : ""}</dd>`).join("")}</dl></div>
      <div class="card"><h3>Competitors met most often</h3>${Object.keys(c.rivals).length ? `<dl>${top(c.rivals).map(([k, v]) => `<dt><a class="lnk" href="#" data-co="${esc(k)}">${esc(k)}</a></dt><dd>${v} bid${v > 1 ? "s" : ""}</dd>`).join("")}</dl>` : `<p class="note">None in sample.</p>`}</div>
      <div class="card"><h3>Seller identity</h3><div class="placeholder">GeM Seller ID, GSTIN, PAN, Udyam number, MSE category. From contract documents.</div></div>
      <div class="card"><h3>Awarded value over time</h3><div class="placeholder">Monthly chart of contract value. Needs contracts.</div></div>
    </div>
    <h2>Bid history</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>RA / Bid</th><th>Category</th><th>Technical</th><th>Rank</th><th class="num">Offered price</th></tr></thead>
      <tbody>${c.bids.map(({ r, t, f }) => `<tr class="click" data-id="${r.b_id}">
        <td>${esc(r.ra_number)}</td><td>${esc(r.category.slice(0, 70))}</td>
        <td>${t ? (/disqualified/i.test(t.Status) ? `<span class="dq">${esc(t.Status)}</span>` : `<span class="q">${esc(t.Status)}</span>`) : "-"}</td>
        <td>${f ? `<span class="tag ${/^L1\b/.test(f.Rank) ? "l1" : ""}">${esc(f.Rank)}</span>` : "-"}</td>
        <td class="num">${f ? inr(price(f["Total Price"])) : "-"}</td></tr>`).join("")}</tbody>
    </table></div>`;
  app.querySelector(".back").onclick = () => setView("companies");
  app.querySelectorAll("a[data-co]").forEach(a => a.onclick = e => { e.preventDefault(); setView("company", { name: a.dataset.co }); });
  app.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => setView("bid", { id: +tr.dataset.id }));
}

render();

// Live data: /api/bids is the Vercel function that reads Neon on the server. Opened from a gist or a file it is not there, and the sample stays.
const banner = document.getElementById("banner"), sampleBanner = banner.innerHTML;
fetch("/api/bids").then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))).then(j => {
  if (!j.bids || !j.bids.length) throw new Error("no rows");
  DATA = j.bids;
  build();
  banner.innerHTML = `Rough wireframe for scoping, not a product. Live data from Neon: the latest ${DATA.length} reverse auctions that GeM awarded, collected by our PoC from public pages. Fields are not final. Dashed boxes and "?" need contract data that is not collected yet.`;
  if (state.view === "bid" || state.view === "company") state = { ...state, view: "bids" };
  render();
}).catch(() => { banner.innerHTML = sampleBanner; });
</script>
