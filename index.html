<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procurement Insights</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: top bar with two tabs, one centred working column; tables scroll inside their own frames */
:root {
  --bg:#ffffff; --fg:#1b1f24; --muted:#5f6b78; --border:#dfe4ea; --soft:#f3f6f9; --accent:#2f5d8a;
  --ok:#2e7d32; --ok-soft:#e7f4e8; --bad:#c62828; --ph:#8a96a3; --warn-bg:#fff7e0; --warn-fg:#6d5a1e; --warn-border:#efdfae; --hover:#f8fafc;
  --sans:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#14181d; --fg:#e6eaee; --muted:#9aa6b2; --border:#2b333c; --soft:#1c2228; --accent:#8bb6e0;
  --ok:#81c784; --ok-soft:#1d3320; --bad:#ef9a9a; --ph:#6f7b87; --warn-bg:#2e2716; --warn-fg:#e6cf8a; --warn-border:#4a3f22; --hover:#1a2026; color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#14181d; --fg:#e6eaee; --muted:#9aa6b2; --border:#2b333c; --soft:#1c2228; --accent:#8bb6e0;
  --ok:#81c784; --ok-soft:#1d3320; --bad:#ef9a9a; --ph:#6f7b87; --warn-bg:#2e2716; --warn-fg:#e6cf8a; --warn-border:#4a3f22; --hover:#1a2026; color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 var(--sans); }
header { border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
header b { font-size:1.05rem; font-weight:600; }
nav { display:flex; gap:4px; }
nav button { background:none; border:0; padding:6px 10px; font:inherit; color:var(--muted); cursor:pointer; border-radius:6px; }
nav button.on { color:var(--fg); background:var(--soft); font-weight:600; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, tr:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.banner { background:var(--warn-bg); border-bottom:1px solid var(--warn-border); padding:8px 16px; font-size:0.85rem; color:var(--warn-fg); }
main { max-width:1100px; margin:0 auto; padding-block:20px 60px; padding-inline:16px; }
h1 { font-size:1.35rem; margin:0 0 4px; font-weight:600; text-wrap:balance; overflow-wrap:anywhere; }
h2 { font-size:1.05rem; margin:28px 0 8px; font-weight:600; }
.sub { color:var(--muted); font-size:0.88rem; margin:0 0 16px; }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
.filters input, .filters select { font:inherit; padding:7px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--fg); min-width:0; max-width:100%; }
.filters input { flex:1 1 240px; }
.table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:8px; }
table { border-collapse:collapse; width:100%; font-size:0.88rem; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
th { background:var(--soft); font-weight:600; white-space:nowrap; }
tr:last-child td { border-bottom:0; }
tbody tr.click { cursor:pointer; }
tbody tr.click:hover { background:var(--hover); }
td.num, th.num { text-align:right; white-space:nowrap; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:0.84rem; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin:12px 0; }
.tile { border:1px solid var(--border); border-radius:8px; padding:12px; min-width:0; }
.tile .v { font-size:1.35rem; font-weight:600; font-family:var(--mono); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.tile .l { color:var(--muted); font-size:0.8rem; }
.tile.ph { border-style:dashed; }
.tile.ph .v { color:var(--ph); }
.tag { display:inline-block; font-size:0.75rem; padding:1px 7px; border-radius:999px; background:var(--soft); color:var(--muted); white-space:nowrap; }
.q { color:var(--ok); font-weight:600; } .dq { color:var(--bad); font-weight:600; }
.tag.l1 { background:var(--ok-soft); color:var(--ok); font-weight:600; }
.grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
@media (max-width:700px){ .grid2 { grid-template-columns:minmax(0,1fr); } }
.card { border:1px solid var(--border); border-radius:8px; padding:12px 14px; min-width:0; }
.card h3 { margin:0 0 8px; font-size:0.95rem; font-weight:600; }
dl { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:4px 12px; margin:0; font-size:0.88rem; }
dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
.back { background:none; border:0; color:var(--accent); cursor:pointer; padding:0; font:inherit; margin-bottom:10px; }
a.lnk { color:var(--accent); cursor:pointer; text-decoration:none; }
a.lnk:hover { text-decoration:underline; }
.note { color:var(--muted); font-size:0.82rem; margin-top:6px; }
.placeholder { border:1px dashed var(--border); border-radius:8px; padding:14px; color:var(--ph); font-size:0.88rem; }
.ph-cell { color:var(--ph); }

/* paging and loading states for the server-driven lists */
.pager { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:12px 0; font-size:0.88rem; color:var(--muted); }
.pager .sp { flex:1 1 auto; }
.pager button, .pager select, .pager input { font:inherit; padding:5px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--fg); }
.pager input { width:5em; text-align:center; }
.pager button { cursor:pointer; }
.pager button:disabled { opacity:0.4; cursor:default; }
.loading { color:var(--muted); padding:18px 10px; }
.err { border:1px solid var(--bad); border-radius:8px; padding:12px 14px; color:var(--bad); }
.err button { margin-left:8px; font:inherit; }
</style>
</head>
<body>
<header>
  <b>Procurement Insights</b>
  <nav>
    <button data-view="bids" class="on">Bids</button>
    <button data-view="companies">Companies</button>
  </nav>
</header>
<div class="banner" id="banner">Rough wireframe for scoping, not a product. Live data from Neon: every bid and reverse auction our PoC has collected from public pages on GeM. Fields are not final. Dashed boxes and "?" need contract data that is not collected yet.</div>
<main id="app"></main>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const price = p => { const m = String(p ?? "").replace(/,/g, "").match(/[\d.]+/); return m ? parseFloat(m[0]) : null; };
const inr = v => v == null ? "-" : "₹ " + Math.round(Number(v)).toLocaleString("en-IN");
const num = n => Number(n).toLocaleString("en-IN");
const day = s => s ? esc(String(s).slice(0, 10)) : "-";
const item = o => typeof o === "object" && o ? Object.entries(o).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join("<br>") : esc(o);
const techStatus = s => !s ? "-" : /disqualified/i.test(s) ? `<span class="dq">${esc(s)}</span>` : /qualified/i.test(s) ? `<span class="q">${esc(s)}</span>` : esc(s);
const rankTag = r => r ? `<span class="tag ${/^L1\b/.test(r) ? "l1" : ""}">${esc(r)}</span>` : "-";

const app = document.getElementById("app");
const SIZES = [25, 50, 100, 200];
let seq = 0;                       // a slow answer for an older screen is dropped when a newer one was asked for
let lastBids = "#/bids", lastCompanies = "#/companies";   // so Back from a detail page returns to the same page of the list

async function api(path, params = {}) {
  const r = await fetch(path + "?" + new URLSearchParams(params));
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "HTTP " + r.status);
  return r.json();
}
function failed(el, error, retry) {
  el.innerHTML = `<div class="err">Could not load the data: ${esc(error.message)} <button>Try again</button></div>`;
  el.querySelector("button").onclick = retry;
}

// ---- paging controls, used above and below a table
function pagerHtml(total, page, size) {
  const pages = Math.max(1, Math.ceil(total / size));
  const from = total ? (page - 1) * size + 1 : 0, to = Math.min(total, page * size);
  return `<div class="pager">
    <span>${total ? `Showing ${num(from)}–${num(to)} of ${num(total)}` : "Nothing to show"}</span><span class="sp"></span>
    <button data-go="1" ${page <= 1 ? "disabled" : ""}>« First</button>
    <button data-go="${page - 1}" ${page <= 1 ? "disabled" : ""}>‹ Prev</button>
    <span>Page <input type="number" min="1" max="${pages}" value="${page}" aria-label="Page number"> of ${num(pages)}</span>
    <button data-go="${page + 1}" ${page >= pages ? "disabled" : ""}>Next ›</button>
    <button data-go="${pages}" ${page >= pages ? "disabled" : ""}>Last »</button>
    <select aria-label="Rows per page">${SIZES.map(s => `<option value="${s}" ${s === size ? "selected" : ""}>${s} per page</option>`).join("")}</select>
  </div>`;
}
function bindPagers(total, size, go, setSize) {
  const pages = Math.max(1, Math.ceil(total / size));
  app.querySelectorAll(".pager").forEach(p => {
    p.querySelectorAll("button[data-go]").forEach(b => b.onclick = () => go(+b.dataset.go));
    p.querySelector("input").onchange = e => go(Math.min(Math.max(1, parseInt(e.target.value, 10) || 1), pages));
    p.querySelector("select").onchange = e => setSize(+e.target.value);
  });
}
function rowLinks(tbody, hashFor) {
  const open = tr => { if (tr && tr.dataset.k != null) location.hash = hashFor(tr.dataset.k); };
  tbody.onclick = e => open(e.target.closest("tr.click"));
  tbody.onkeydown = e => { if (e.key === "Enter") open(e.target.closest("tr.click")); };
}
const debounce = (fn, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

// ---- routes:  #/bids?q=&ministry=&page=&size=   #/bid/<bid number>   #/companies?q=&page=&size=   #/company/<name>
function render() {
  const [path, qs] = (location.hash.slice(1) || "/bids").split("?");
  const [view, id] = path.split("/").filter(Boolean).map(decodeURIComponent);
  const p = new URLSearchParams(qs || "");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.view === (view === "bid" ? "bids" : view === "company" ? "companies" : view || "bids")));
  window.scrollTo(0, 0);
  if (view === "bid") return renderBid(id);
  if (view === "company") return renderCompany(id);
  if (view === "companies") return renderCompanies(p);
  return renderBids(p);
}
window.addEventListener("hashchange", render);
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { location.hash = b.dataset.view === "companies" ? lastCompanies : lastBids; });

// ---- Bids
function renderBids(p) {
  const st = { q: p.get("q") || "", ministry: p.get("ministry") || "", page: Math.max(1, +p.get("page") || 1), size: SIZES.includes(+p.get("size")) ? +p.get("size") : 50 };
  app.innerHTML = `
    <h1>Bids</h1>
    <p class="sub" id="sub">Loading…</p>
    <div class="filters">
      <input id="q" placeholder="Search bid number, category, department, ministry" value="${esc(st.q)}">
      <select id="min"><option value="">All ministries</option></select>
      <select disabled><option>Status: all (filter planned)</option></select>
      <select disabled><option>End date: any (filter planned)</option></select>
    </div>
    <div id="top"></div>
    <div class="table-wrap"><table>
      <thead><tr><th>RA / Bid</th><th>Category</th><th>Ministry / Department</th><th class="num">Qty</th><th class="num">Sellers</th><th>L1 seller</th><th class="num">L1 price</th><th>Ends</th></tr></thead>
      <tbody id="tb"><tr><td colspan="8" class="loading">Loading…</td></tr></tbody>
    </table></div>
    <div id="bottom"></div>`;
  const tb = document.getElementById("tb"), min = document.getElementById("min");
  rowLinks(tb, k => "#/bid/" + encodeURIComponent(k));
  let facets = false;
  const hash = () => "#/bids?" + new URLSearchParams({ ...(st.q && { q: st.q }), ...(st.ministry && { ministry: st.ministry }), page: st.page, size: st.size });
  async function load() {
    const my = ++seq;
    history.replaceState(null, "", hash()); lastBids = hash();
    try {
      const d = await api("/api/bids", { q: st.q, ministry: st.ministry, limit: st.size, offset: (st.page - 1) * st.size });
      if (my !== seq) return;
      const pages = Math.max(1, Math.ceil(d.total / st.size));
      if (st.page > pages) { st.page = pages; return load(); }
      if (!facets) {
        facets = true;
        min.innerHTML = `<option value="">All ministries</option>` + d.ministries.map(m => `<option value="${esc(m.name)}" ${m.name === st.ministry ? "selected" : ""}>${esc(m.name)} (${num(m.n)})</option>`).join("");
      }
      document.getElementById("sub").textContent = `${num(d.total)} bid${d.total === 1 ? "" : "s"} with results${st.q || st.ministry ? " match" : ""}. Click a row for the evaluation.`;
      tb.innerHTML = d.bids.map(r => `<tr class="click" tabindex="0" data-k="${esc(r.bid_number)}">
        <td>${esc(r.is_ra ? r.ra_number : r.bid_number)}<br><span class="note">${r.is_ra ? esc(r.bid_number) : "bid, no reverse auction"}</span></td>
        <td>${esc(r.category.slice(0, 90))}</td>
        <td>${esc(r.ministry)}<br><span class="note">${esc(r.department)}</span></td>
        <td class="num">${esc(r.quantity ?? "-")}</td>
        <td class="num">${num(Math.max(r.n_tech, r.n_fin))}</td>
        <td>${r.l1_seller ? esc(r.l1_seller) : "-"}</td>
        <td class="num">${r.l1_price ? inr(price(r.l1_price)) : "-"}</td>
        <td>${day(r.end_at)}</td></tr>`).join("") || `<tr><td colspan="8">No bids match.</td></tr>`;
      for (const id of ["top", "bottom"]) document.getElementById(id).innerHTML = pagerHtml(d.total, st.page, st.size);
      bindPagers(d.total, st.size, n => { st.page = n; load(); window.scrollTo(0, 0); }, n => { st.size = n; st.page = 1; load(); });
    } catch (e) { if (my === seq) failed(tb.closest(".table-wrap"), e, load); }
  }
  document.getElementById("q").oninput = debounce(e => { st.q = e.target.value.trim(); st.page = 1; load(); });
  min.onchange = e => { st.ministry = e.target.value; st.page = 1; load(); };
  load();
}

function dl(obj) {
  const e = Object.entries(obj || {});
  return e.length ? `<dl>${e.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : `<p class="note">Not on page.</p>`;
}
const sellerLink = (name, key) => key ? `<a class="lnk" href="#/company/${encodeURIComponent(key)}">${esc(name)}</a>` : esc(name);

// ---- one bid
async function renderBid(id) {
  const my = ++seq;
  app.innerHTML = `<button class="back">← All bids</button><p class="loading">Loading…</p>`;
  app.querySelector(".back").onclick = () => { location.hash = lastBids; };
  const load = () => renderBid(id);
  let r;
  try { r = await api("/api/bid", { id }); } catch (e) { if (my === seq) failed(app.querySelector(".loading"), e, load); return; }
  if (my !== seq) return;
  const l1 = price((r.financial.find(f => /^L1\b/.test(f.Rank)) || {})["Total Price"]);
  app.innerHTML = `
    <button class="back">← All bids</button>
    <h1>${esc(r.is_ra ? r.ra_number : r.bid_number)}</h1>
    <p class="sub">${r.is_ra ? `Parent bid ${esc(r.bid_number)}` : "Bid without a reverse auction"} · ${esc(r.category)}</p>
    <div class="grid2">
      <div class="card"><h3>Bid details</h3>${dl(r.bid_details)}</div>
      ${r.is_ra ? `<div class="card"><h3>RA details</h3>${dl(r.ra_details)}</div>` : ""}
      <div class="card"><h3>Buyer</h3>${dl(r.buyer)}<p class="note">Buyer name, email, phone and address are on the page but left out here.</p></div>
      <div class="card"><h3>Contract</h3><div class="placeholder">Contract number, seller ID, final value and status will come from View Contracts.</div></div>
    </div>
    <h2>Technical evaluation (${num(r.technical.length)} sellers)</h2>
    ${r.technical.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Seller</th><th>Offered item</th><th>Participated on</th><th>EMD</th><th>MSE / MII</th><th>Status</th></tr></thead>
      <tbody>${r.technical.map(t => `<tr>
        <td>${sellerLink(t["Seller Name"], t._k)}</td>
        <td>${item(t["Offered Item"])}</td>
        <td>${esc(t["Participated On"])}</td>
        <td>${esc(t["EMD Status"] ?? "-")}</td>
        <td>${esc(t["MSE/MII Status"] ?? "-")}${(t["MSE/MII Status notes"] || []).length ? `<div class="note">${t["MSE/MII Status notes"].map(esc).join("<br>")}</div>` : ""}</td>
        <td>${techStatus(t.Status)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="note">This bid has no technical evaluation table on its page.</p>`}
    <h2>Financial evaluation (${num(r.financial.length)} sellers)</h2>
    ${r.financial.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Rank</th><th>Seller</th><th class="num">Total price</th><th class="num">vs L1</th></tr></thead>
      <tbody>${r.financial.map(f => { const p = price(f["Total Price"]);
        return `<tr><td>${rankTag(f.Rank)}</td><td>${sellerLink(f["Seller Name"], f._k)}</td>
          <td class="num">${inr(p)}</td>
          <td class="num">${l1 && p && p !== l1 ? "+" + ((p / l1 - 1) * 100).toFixed(1) + "%" : "-"}</td></tr>`; }).join("")}</tbody></table></div>` : `<p class="note">This bid has no financial evaluation table on its page yet.</p>`}
    <p class="note">Offered prices. GeM states these may change through negotiation or price matching.</p>
    ${r.notices.length ? `<h2>Notices</h2><ul>${r.notices.map(n => `<li class="note">${esc(n)}</li>`).join("")}</ul>` : ""}`;
  app.querySelector(".back").onclick = () => { location.hash = lastBids; };
}

// ---- Companies
function renderCompanies(p) {
  const st = { q: p.get("q") || "", page: Math.max(1, +p.get("page") || 1), size: SIZES.includes(+p.get("size")) ? +p.get("size") : 50 };
  app.innerHTML = `
    <h1>Companies</h1>
    <p class="sub" id="sub">Loading…</p>
    <div class="filters"><input id="cq" placeholder="Search company" value="${esc(st.q)}"></div>
    <div id="top"></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Company</th><th class="num">Bids placed</th><th class="num">Tech qualified</th><th class="num">Ranked L1</th><th class="num">L1 value</th><th class="num">Contracts won</th><th class="num">Awarded value</th></tr></thead>
      <tbody id="ctb"><tr><td colspan="7" class="loading">Loading…</td></tr></tbody>
    </table></div>
    <div id="bottom"></div>
    <p class="note">Contracts won and awarded value need the contract crawl. Shown as "?" until then.</p>`;
  const tb = document.getElementById("ctb");
  rowLinks(tb, k => "#/company/" + encodeURIComponent(k));
  const hash = () => "#/companies?" + new URLSearchParams({ ...(st.q && { q: st.q }), page: st.page, size: st.size });
  async function load() {
    const my = ++seq;
    history.replaceState(null, "", hash()); lastCompanies = hash();
    try {
      const d = await api("/api/companies", { q: st.q, limit: st.size, offset: (st.page - 1) * st.size });
      if (my !== seq) return;
      const pages = Math.max(1, Math.ceil(d.total / st.size));
      if (st.page > pages) { st.page = pages; return load(); }
      document.getElementById("sub").textContent = `${num(d.total)} seller${d.total === 1 ? "" : "s"} ${st.q ? "match" : "found"}, grouped by name. Click a row for the company page.`;
      tb.innerHTML = d.companies.map(c => `<tr class="click" tabindex="0" data-k="${esc(c.k)}"><td>${esc(c.k)}</td><td class="num">${num(c.bids)}</td><td class="num">${num(c.tq)}</td>
        <td class="num">${num(c.l1)}</td><td class="num">${c.l1 ? inr(c.l1_value) : "-"}</td><td class="num ph-cell">?</td><td class="num ph-cell">?</td></tr>`).join("")
        || `<tr><td colspan="7">No companies match.</td></tr>`;
      for (const id of ["top", "bottom"]) document.getElementById(id).innerHTML = pagerHtml(d.total, st.page, st.size);
      bindPagers(d.total, st.size, n => { st.page = n; load(); window.scrollTo(0, 0); }, n => { st.size = n; st.page = 1; load(); });
    } catch (e) { if (my === seq) failed(tb.closest(".table-wrap"), e, load); }
  }
  document.getElementById("cq").oninput = debounce(e => { st.q = e.target.value.trim(); st.page = 1; load(); });
  load();
}

// ---- one company
async function renderCompany(key) {
  const my = ++seq;
  app.innerHTML = `<button class="back">← Companies</button><p class="loading">Loading…</p>`;
  app.querySelector(".back").onclick = () => { location.hash = lastCompanies; };
  let c;
  try { c = await api("/api/company", { key }); } catch (e) { if (my === seq) failed(app.querySelector(".loading"), e, () => renderCompany(key)); return; }
  if (my !== seq) return;
  const bids = n => `${num(n)} bid${n > 1 ? "s" : ""}`;
  app.innerHTML = `
    <button class="back">← Companies</button>
    <h1>${esc(c.key)}</h1>
    <p class="sub">Matched by name only. Seller ID and GSTIN will come from contract documents.</p>
    <div class="tiles">
      <div class="tile"><div class="v">${num(c.bids)}</div><div class="l">Bids placed</div></div>
      <div class="tile"><div class="v">${num(c.tq)}</div><div class="l">Technically qualified</div></div>
      <div class="tile"><div class="v">${num(c.l1)}</div><div class="l">Ranked L1</div></div>
      <div class="tile"><div class="v">${c.bids ? Math.round(c.l1 / c.bids * 100) : 0}%</div><div class="l">L1 rate (L1 ÷ bids placed)</div></div>
      <div class="tile"><div class="v">${c.l1 ? inr(c.l1_value) : "-"}</div><div class="l">Value of L1 offers</div></div>
      <div class="tile ph"><div class="v">?</div><div class="l">Contracts won</div></div>
      <div class="tile ph"><div class="v">?</div><div class="l">Awarded value</div></div>
      <div class="tile ph"><div class="v">?</div><div class="l">Win rate (contracts ÷ bids)</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Buyers (by ministry)</h3><dl>${c.ministries.map(m => `<dt>${esc(m.name || "-")}</dt><dd>${bids(m.n)}</dd>`).join("")}</dl></div>
      <div class="card"><h3>Competitors met most often</h3>${c.rivals.length ? `<dl>${c.rivals.map(r => `<dt><a class="lnk" href="#/company/${encodeURIComponent(r.key)}">${esc(r.key)}</a></dt><dd>${bids(r.n)}</dd>`).join("")}</dl>` : `<p class="note">None.</p>`}</div>
      <div class="card"><h3>Seller identity</h3><div class="placeholder">GeM Seller ID, GSTIN, PAN, Udyam number, MSE category. From contract documents.</div></div>
      <div class="card"><h3>Awarded value over time</h3><div class="placeholder">Monthly chart of contract value. Needs contracts.</div></div>
    </div>
    <h2>Bid history (${num(c.history.length)})</h2>
    <div id="top"></div>
    <div class="table-wrap"><table>
      <thead><tr><th>RA / Bid</th><th>Category</th><th>Ends</th><th>Technical</th><th>Rank</th><th class="num">Offered price</th></tr></thead>
      <tbody id="hist"></tbody>
    </table></div>
    <div id="bottom"></div>`;
  app.querySelector(".back").onclick = () => { location.hash = lastCompanies; };
  const st = { page: 1, size: 25 };
  const tb = document.getElementById("hist");
  rowLinks(tb, k => "#/bid/" + encodeURIComponent(k));
  const show = () => {
    const pages = Math.max(1, Math.ceil(c.history.length / st.size)); st.page = Math.min(st.page, pages);
    tb.innerHTML = c.history.slice((st.page - 1) * st.size, st.page * st.size).map(h => `<tr class="click" tabindex="0" data-k="${esc(h.bid_number)}">
      <td>${esc(h.ra_number || h.bid_number)}</td><td>${esc(h.category.slice(0, 70))}</td><td>${day(h.end_at)}</td>
      <td>${techStatus(h.tech_status)}</td><td>${rankTag(h.rank)}</td><td class="num">${inr(h.price)}</td></tr>`).join("");
    for (const id of ["top", "bottom"]) document.getElementById(id).innerHTML = pagerHtml(c.history.length, st.page, st.size);
    bindPagers(c.history.length, st.size, n => { st.page = n; show(); }, n => { st.size = n; st.page = 1; show(); });
  };
  show();
}

render();
</script>
</body>
</html>
